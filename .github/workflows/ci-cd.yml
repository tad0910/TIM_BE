name: CI/CD Pipeline (Test -> Backup -> Deploy -> Log)

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # -----------------------------------------------------------------
  # GIAI ĐOẠN 1: CHẠY TEST CASE (CI)
  # -----------------------------------------------------------------
  run-tests:
    name: 🧪 Run Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Chạy lệnh test
      - name: Execute Tests
        run: mvn -B test --file pom.xml

  # -----------------------------------------------------------------
  # GIAI ĐOẠN 2: BACKUP DỮ LIỆU
  # -----------------------------------------------------------------
  backup-data:
    name: 💾 Backup Database & Code
    needs: run-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - name: Backup Placeholder
        run: |
          echo "--- BẮT ĐẦU QUY TRÌNH BACKUP ---"
          echo "Hiện tại chưa cần thực hiện backup theo yêu cầu."
          echo "--- KẾT THÚC BACKUP ---"

  # -----------------------------------------------------------------
  # GIAI ĐOẠN 3: BUILD & DEPLOY (CD)
  # -----------------------------------------------------------------
  deploy:
    name: 🚀 Build & Deploy
    needs: run-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # [ĐÃ SỬA LỖI TẠI ĐÂY]
      # Gộp lệnh thành 1 dòng để tránh lỗi "Unexpected token" trên Windows PowerShell
      - name: Build JAR
        run: mvn -B clean package -DskipTests -Dproject.build.sourceEncoding=UTF-8 --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/apptim-be:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}

      # -----------------------------------------------------------
      # KÍCH HOẠT SERVER (DEPLOY)
      # -----------------------------------------------------------
      - name: Trigger Render Production
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Đang deploy lên Production..."
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}

      - name: Trigger Render Dev
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "Đang deploy lên Dev Environment..."
          curl -X POST ${{ secrets.RENDER_DEV_HOOK }}