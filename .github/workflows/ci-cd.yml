name: CI/CD Pipeline (Test -> Backup -> Deploy -> Log)

on:
  push:
    branches: [ "**" ]       # Chạy trên mọi nhánh khi push
  pull_request:
      branches: [ "**" ]       # Chạy trên mọi nhánh khi tạo PR
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------
  # GIAI ĐOẠN 1: CHẠY TEST CASE (CI)
  # -----------------------------------------------------------------
  run-tests:
    name: 🧪 Run Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # SỬA: Dùng mvnw.cmd thay vì mvn để tránh lỗi nếu máy chưa cài Maven
      # Nếu project không có mvnw, hãy đảm bảo bạn đã cài Maven và add vào PATH
      - name: Execute Tests
        run: |
          if (Test-Path "mvnw.cmd") {
            ./mvnw.cmd -B test --file pom.xml
          } else {
            mvn -B test --file pom.xml
          }

  # -----------------------------------------------------------------
  # GIAI ĐOẠN 2: BACKUP DỮ LIỆU
  # -----------------------------------------------------------------
  backup-data:
    name: 💾 Backup Database & Code
    needs: run-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - name: Backup Placeholder
        run: |
          Write-Host "--- BẮT ĐẦU QUY TRÌNH BACKUP ---"
          Write-Host "Hiện tại chưa cần thực hiện backup theo yêu cầu."
          Write-Host "--- KẾT THÚC BACKUP ---"

  # -----------------------------------------------------------------
  # GIAI ĐOẠN 3: BUILD & DEPLOY (CD)
  # -----------------------------------------------------------------
  deploy:
    name: 🚀 Build & Deploy
    needs: run-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # SỬA: Dùng mvnw và quote cẩn thận cho PowerShell
      - name: Build JAR
        run: |
          $buildCmd = if (Test-Path "mvnw.cmd") { "./mvnw.cmd" } else { "mvn" }
          Invoke-Expression "$buildCmd -B clean package -DskipTests '-Dproject.build.sourceEncoding=UTF-8' --file pom.xml"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Sửa logic tags cho dễ đọc hơn
          tags: ${{ secrets.DOCKER_USERNAME }}/apptim-be:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}

      # -----------------------------------------------------------
      # KÍCH HOẠT SERVER (DEPLOY) - ĐÃ SỬA CHO POWERSHELL
      # -----------------------------------------------------------
      - name: Trigger Render Production
        if: github.ref == 'refs/heads/main'
        run: |
          Write-Host "Đang deploy lên Production..."
          Invoke-RestMethod -Uri "${{ secrets.RENDER_PROD_HOOK }}" -Method Post

      - name: Trigger Render Dev
        if: github.ref == 'refs/heads/develop'
        run: |
          Write-Host "Đang deploy lên Dev Environment..."
          Invoke-RestMethod -Uri "${{ secrets.RENDER_DEV_HOOK }}" -Method Post