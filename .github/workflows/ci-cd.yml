name: CI/CD Pipeline (Test -> Backup -> Deploy -> Log)

# 1. KÍCH HOẠT (TRIGGER)
on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # -----------------------------------------------------------------
  # GIAI ĐOẠN 1: CHẠY TEST CASE (CI)
  # -----------------------------------------------------------------
  run-tests:
    name: 🧪 Run Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Tests
        shell: cmd
        run: mvn -B test --file pom.xml

  # -----------------------------------------------------------------
  # GIAI ĐOẠN 2: BACKUP DỮ LIỆU
  # -----------------------------------------------------------------
  backup-data:
    name: 💾 Backup Database & Code
    needs: run-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - name: Backup Placeholder
        # Chạy mặc định (PowerShell) là tốt nhất cho lệnh echo đơn giản
        run: |
          echo "--- BAT DAU QUY TRINH BACKUP ---"
          echo "Run on Self-hosted runner"
          echo "--- KET THUC BACKUP ---"

  # -----------------------------------------------------------------
  # GIAI ĐOẠN 3: BUILD & DEPLOY (CD)
  # -----------------------------------------------------------------
  deploy:
    name: 🚀 Build & Deploy
    needs: run-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        # Đã xóa tham số gây lỗi "-Dproject.build...", chỉ giữ lại các tham số cần thiết
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/apptim-be:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}

      # -----------------------------------------------------------
      # KÍCH HOẠT SERVER (DEPLOY)
      # -----------------------------------------------------------

      - name: Trigger Render Production
        if: github.ref == 'refs/heads/main'
        shell: cmd  # Bắt buộc dùng cmd để chạy curl trên Windows ổn định
        run: |
          echo Dang deploy len Production...
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}

      - name: Trigger Render Dev
        if: github.ref == 'refs/heads/develop'
        shell: cmd  # Bắt buộc dùng cmd để chạy curl trên Windows ổn định
        run: |
          echo Dang deploy len Dev Environment...
          curl -X POST ${{ secrets.RENDER_DEV_HOOK }}