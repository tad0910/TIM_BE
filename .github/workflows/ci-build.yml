# Tên của quy trình
name: Java CI Build and Test

# Kích hoạt quy trình
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Các công việc
jobs:
  build:
    # Môi trường chạy
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy code từ kho GitHub về
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt JDK 21 (!!! ĐÂY LÀ THAY ĐỔI QUAN TRỌNG !!!)
      # Khớp với <java.version>21</java.version> trong pom.xml
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Lưu cache thư viện Maven để build nhanh hơn

      # Bước 3: Build và Test với Maven
      - name: Build and Test with Maven
        # Lệnh này sẽ tự động chạy các test (dùng H2, spring-security-test,...)
        run: mvn -B package --file pom.xml