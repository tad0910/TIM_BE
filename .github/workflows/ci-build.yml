name: Java CI, Build, Push Docker and Deploy

on:
  push:
    branches: [ "main" ] # Chỉ deploy nhánh main
  pull_request:
    branches: [ "main", "develop" ] # Chạy test cho PR vào 2 nhánh này

jobs:
  # ------ JOB 1: BUILD & TEST (CI) ------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Chạy build VÀ test (Đã xóa -DskipTests)
      - name: Build and Test with Maven (UTF-8)
        run: mvn -B clean package -Dproject.build.sourceEncoding=UTF-8 --file pom.xml

      # Lưu file .jar để job sau dùng
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ------ JOB 2: PUSH TO DOCKER & DEPLOY (CD) ------
  push-and-deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} # Đây là Access Token

      # Build và Đẩy Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # !!! ĐÂY LÀ TÊN IMAGE CỦA BẠN !!!
          tags: ${{ secrets.DOCKER_USERNAME }}/alm-team-tim-be:latest

      # Kích hoạt Render Deploy Hook
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}