name: Java CI (Build & Test)

on:
  push:
    branches: [ "main"] # Chạy khi push lên main hoặc develop
  pull_request:
    branches: [ "main", "develop" ] # Chạy khi tạo PR vào main hoặc develop

jobs:
  # ------ JOB 1: BUILD & TEST (CI) ------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Chạy build VÀ test (Đã xóa -DskipTests)
      - name: Build and Test with Maven (UTF-8)
        run: mvn -B clean package -Dproject.build.sourceEncoding=UTF-8 --file pom.xml