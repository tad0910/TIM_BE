name: Build & Push Docker

on:
  push:
    branches: [ "main" ] # Chỉ chạy khi code được merge vào main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Lấy code về
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build file .jar (Thêm -DskipTests để chạy nhanh hơn)
      - name: Build with Maven
        run: mvn -B clean package -DskipTests -Dproject.build.sourceEncoding=UTF-8 --file pom.xml

      # 4. Đăng nhập Docker Hub (Cần cài đặt Secrets trước)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Đóng gói và Đẩy ảnh lên Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Thay 'apptim-be' bằng tên bạn muốn đặt cho ảnh
          # Dòng này sẽ tạo ảnh dạng: tad0990/apptim-be:latest
          tags: ${{ secrets.DOCKER_USERNAME }}/apptim-be:latest