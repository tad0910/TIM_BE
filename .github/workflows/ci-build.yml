name: Java CI, Build, Push Docker and Deploy

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ------ JOB 1: BUILD & TEST (CI) ------
  # Job này chạy trên mọi push và PR để đảm bảo chất lượng code
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: mvn -B package --file pom.xml

      # Lưu file .jar để job sau dùng
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ------ JOB 2: PUSH TO DOCKER & DEPLOY (CD) ------
  # Job này chỉ chạy khi push lên nhánh 'main'
  push-and-deploy:
    # Cần job 'build-and-test' chạy xong
    needs: build-and-test

    # Chỉ chạy khi push (không chạy khi PR) lên nhánh 'main'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tải file .jar từ job trước về thư mục target
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # Đăng nhập vào Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} # Đây là Access Token

      # Build và Đẩy Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Lấy Dockerfile ở thư mục gốc
          push: true
          # Đặt tên cho image: ten-docker-hub/ten-image:latest
          tags: ${{ secrets.DOCKER_USERNAME }}/alm-team-tim-be:latest

      # Bước 5: Kích hoạt Render Deploy Hook
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}