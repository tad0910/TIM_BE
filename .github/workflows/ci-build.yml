name: Java CI Build and Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ------ JOB DUY NHẤT: CHỈ BUILD VÀ TEST ------
  build:
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Lấy code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 3: Build và Test (Quan trọng nhất)
      # Lệnh này xác nhận code có thể biên dịch và vượt qua tất cả test
      - name: Build and Test with Maven
        run: mvn -B package --file pom.xml