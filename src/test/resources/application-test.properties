spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.task.scheduling.enabled=false 
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true

# Cloudinary Configuration (dummy values for testing)
cloudinary.cloud_name=test-cloud
cloudinary.api_key=test-api-key
cloudinary.api_secret=test-api-secret

# Upload folder (for testing)
upload.folder=./test-uploads

# App pepper (for HMAC)
app.pepper=test-pepper-key

# Keycloak Configuration (dummy values for testing)
keycloak.server-url=https://id.dev.codegym.vn/auth
keycloak.realm=codegym-software-nhom-4
keycloak.client-id-app=tim_app
keycloak.client-secret=test-secret
keycloak.introspectUrl=https://id.dev.codegym.vn/auth/realms/codegym-software-nhom-4/protocol/openid-connect/token/introspect

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Mail Configuration (dummy values for testing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OAuth2 Resource Server (for JWT validation in tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://id.dev.codegym.vn/auth/realms/codegym-software-nhom-4