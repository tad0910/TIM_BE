spring.application.name=appTim
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=REQUIRED&trustServerCertificate=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false 

# Email (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server pepper cho HMAC
app.pepper=${APP_PEPPER}

# Keycloak
keycloak.server-url=https://id.dev.codegym.vn/auth
keycloak.realm=codegym-software-nhom-4
keycloak.client-id-app=tim_app
keycloak.client-secret=${KEYCLOAK_SECRET}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://id.dev.codegym.vn/auth/realms/codegym-software-nhom-4
keycloak.introspectUrl=https://id.dev.codegym.vn/auth/realms/codegym-software-nhom-4/protocol/openid-connect/token/introspect

#Size file
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Tomcat limits
server.tomcat.max-http-form-post-size=100MB

# CORS Configuration
spring.web.cors.allowed-origins=${FRONTEND_URL}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Static file serving
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.max-age=3600

# Cache
spring.cache.type=caffeine

spring.cache.caffeine.spec.latestBlogs=expireAfterWrite=30m
spring.cache.caffeine.spec.featuredBlogs=expireAfterWrite=30m

spring.cache.caffeine.spec.techNews=expireAfterWrite=30m

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=TimAppHikariPool

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# 3. Driver Performance (Quan tr?ng cho MySQL/TiDB)
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# Jackson Configuration - Serialize LocalDateTime as ISO-8601 string with UTC timezone
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC



